<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2d6a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recetario">
<link rel="manifest" href="manifest.json">
<title>Recetario · Am Felen</title>
<style>
:root{
  --green:#2d6a4f;--gl:#52b788;--gp:#d8f3dc;
  --orange:#e76f51;--ol:#ffddd2;
  --bg:#f8fdf9;--gray:#6c757d;--border:#b7e4c7;--text:#1b4332;
  --shadow:0 2px 12px rgba(45,106,79,.10);--r:12px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(var(--sb) + 76px)}

/* Header */
.hdr{background:var(--green);color:#fff;padding:calc(var(--st) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hdr-logo{font-size:26px}
.hdr-title h1{font-size:1rem;font-weight:700}
.hdr-title p{font-size:.7rem;opacity:.82;margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-date{font-size:.68rem;opacity:.8;text-align:right;line-height:1.4}
.btn-glosario{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-glosario:active{background:rgba(255,255,255,.3)}

/* Patient */
.sec{background:#fff;margin:12px 12px 0;border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.sec h2{font-size:.75rem;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pgrid label{font-size:.68rem;color:var(--gray);display:block;margin-bottom:2px;font-weight:500}
.pgrid input{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 9px;font-size:.88rem;background:var(--bg);color:var(--text);-webkit-appearance:none}
.pgrid input:focus{outline:none;border-color:var(--gl);box-shadow:0 0 0 3px rgba(82,183,136,.15)}

/* Tabs */
.tabs-wrap{margin:12px 12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:3px;min-width:max-content}
.tab{padding:7px 12px;border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;background:#e8f5e9;cursor:pointer;font-size:.76rem;font-weight:500;color:var(--green);white-space:nowrap;transition:background .15s;-webkit-user-select:none;user-select:none}
.tab.active{background:#fff;font-weight:700;border-bottom:1px solid #fff;margin-bottom:-1px;z-index:1}
.panels{background:#fff;border-radius:0 var(--r) var(--r) var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:12px;margin:0 12px;min-height:240px}
.panel{display:none}.panel.active{display:block}

/* Panel header */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.ph-title{font-size:.8rem;font-weight:600;color:var(--green)}
.ph-count{font-size:.7rem;color:var(--gray)}

/* Search row */
.add-row{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.sw{position:relative;flex:1;min-width:150px}
.sw input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 9px 9px 32px;font-size:.88rem;background:var(--bg);color:var(--text);-webkit-appearance:none}
.sw input:focus{outline:none;border-color:var(--gl);box-shadow:0 0 0 3px rgba(82,183,136,.12)}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;color:var(--gl)}
.dd{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--gl);border-top:none;border-radius:0 0 9px 9px;max-height:210px;overflow-y:auto;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.12);-webkit-overflow-scrolling:touch}
.di{padding:9px 11px;font-size:.81rem;cursor:pointer;border-bottom:1px solid #f0f0f0;line-height:1.4}
.di:active,.di:hover{background:var(--gp)}
.di mark{background:#fff176;border-radius:2px;font-style:normal}
.de{padding:11px;color:var(--gray);font-size:.81rem;text-align:center}

.btn{padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;-webkit-user-select:none;user-select:none}
.btn-add{background:var(--green);color:#fff;font-size:.76rem;padding:9px 11px}
.btn-add:active{background:var(--gl)}
.btn-del{background:#fee2e2;color:#dc2626;border:none;cursor:pointer;border-radius:6px;padding:4px 9px;font-size:13px;min-width:30px;min-height:30px;display:flex;align-items:center;justify-content:center}
.btn-del:active{background:#fca5a5}

/* Item list */
.list{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ir{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;border-bottom:1px solid #f0f4f1;background:#fff}
.ir:last-child{border-bottom:none}
.ir:nth-child(even){background:#f9fdf9}
.inum{min-width:20px;height:20px;background:var(--green);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0;margin-top:2px}
.itext{flex:1;font-size:.81rem;line-height:1.5;word-break:break-word;padding:2px 3px;border-radius:4px;border:1px solid transparent;cursor:text}
.itext:focus{outline:none;border-color:var(--gl);background:#fff}
.empty{padding:22px;text-align:center;color:var(--gray);font-size:.83rem}

/* Footer */
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 12px calc(var(--sb) + 8px);display:flex;gap:6px;justify-content:flex-end;box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:40}
.btn-print{background:var(--green);color:#fff;padding:10px 16px;font-size:.85rem;flex:1;justify-content:center}
.btn-print:active{background:var(--gl)}
.btn-clear{background:#fff;color:var(--orange);border:1.5px solid var(--orange);padding:10px 12px;font-size:.8rem}
.btn-clear:active{background:var(--ol)}
.btn-prev{background:var(--gp);color:var(--green);border:1.5px solid var(--gl);padding:10px 12px;font-size:.8rem}
.btn-prev:active{background:var(--gl);color:#fff}
.btn-copy{background:#fff;color:#0077cc;border:1.5px solid #0077cc;padding:10px 12px;font-size:.8rem}
.btn-copy:active{background:#e8f4ff}
.btn-copy.copied{background:#0077cc;color:#fff}

/* Overlay base */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow:auto;padding:18px 16px calc(var(--sb) + 18px);-webkit-overflow-scrolling:touch}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:sticky;top:0;background:#fff;padding-bottom:8px;border-bottom:1px solid var(--border)}
.modal-hdr strong{font-size:.88rem}
.modal-close{background:#f0f0f0;border:none;font-size:17px;cursor:pointer;color:var(--gray);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ── GLOSARIO MODAL ── */
#gmodal .modal{max-height:96vh}
.gtabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:12px}
.gtab{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:#e8f5e9;cursor:pointer;font-size:.73rem;font-weight:500;color:var(--green);-webkit-user-select:none;user-select:none}
.gtab.active{background:var(--green);color:#fff;border-color:var(--green)}
.gsearch-row{display:flex;gap:7px;margin-bottom:10px}
.gsearch-row input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 11px;font-size:.88rem;background:var(--bg);color:var(--text);-webkit-appearance:none}
.gsearch-row input:focus{outline:none;border-color:var(--gl)}
.btn-gadd{background:var(--green);color:#fff;border-radius:8px;border:none;padding:9px 13px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-gadd:active{background:var(--gl)}
.glist{border:1px solid var(--border);border-radius:8px;overflow:hidden;max-height:45vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.gitem{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid #f0f4f1;background:#fff}
.gitem:last-child{border-bottom:none}
.gitem:nth-child(even){background:#f9fdf9}
.gitem-text{flex:1;font-size:.8rem;line-height:1.4;word-break:break-word;padding:2px 3px;border-radius:4px;border:1px solid transparent;cursor:text}
.gitem-text:focus{outline:none;border-color:var(--gl);background:#fff}
.btn-gdel{background:#fee2e2;color:#dc2626;border:none;cursor:pointer;border-radius:5px;padding:3px 8px;font-size:12px;min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-gdel:active{background:#fca5a5}
.gempty{padding:20px;text-align:center;color:var(--gray);font-size:.82rem}
.gsaved{background:#d8f3dc;color:var(--green);border-radius:6px;padding:5px 10px;font-size:.75rem;font-weight:600;text-align:center;margin-top:8px;display:none}
.gcount{font-size:.72rem;color:var(--gray);margin-bottom:6px}
.gsearch-filter{display:flex;gap:7px;margin-bottom:8px}
.gsearch-filter input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px 8px 30px;font-size:.85rem;background:var(--bg);color:var(--text);-webkit-appearance:none}
.gsearch-filter input:focus{outline:none;border-color:var(--gl)}
.gsf-wrap{position:relative;flex:1}
.gsf-wrap::before{content:"🔍";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}

/* Print */
#parea{display:none}
@media print{
  body>*:not(#parea){display:none!important}
  #parea{display:block!important}
  .pp{padding:12mm 16mm;font-family:Arial,sans-serif;color:#000;font-size:10pt}
  .ph2{display:flex;justify-content:space-between;border-bottom:2px solid #2d6a4f;padding-bottom:8px;margin-bottom:11px}
  .ph2 h1{font-size:13pt;color:#2d6a4f;margin-bottom:3px}
  .ph2 div{font-size:8.5pt}
  .ppt{background:#f8fdf9;border:1px solid #b7e4c7;border-radius:5px;padding:6px 10px;margin-bottom:11px;font-size:9pt}
  .ppt table{width:100%}.ppt td{padding:2px 5px 2px 0}
  .psec{margin-bottom:9px;page-break-inside:avoid}
  .pst{font-size:8.5pt;font-weight:bold;color:#2d6a4f;text-transform:uppercase;letter-spacing:.5px;border-left:3px solid #52b788;padding-left:5px;margin-bottom:4px}
  ol{list-style:none;counter-reset:it;padding:0}
  li{font-size:9pt;padding:2px 0 2px 15px;border-bottom:.5px dotted #ccc;line-height:1.4;counter-increment:it}
  li::before{content:counter(it)". ";color:#2d6a4f;font-weight:bold}
  .pftr{margin-top:12px;border-top:1px solid #ccc;padding-top:5px;font-size:8pt;color:#555;display:flex;justify-content:space-between}
  .psign{margin-top:26px;border-top:1px solid #000;width:165px;text-align:center;font-size:8.5pt;padding-top:3px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">🌿</div>
  <div class="hdr-title">
    <h1>Am Felen · Medicina de la Tierra</h1>
    <p>Sistema de Recetas Médicas</p>
  </div>
  <div class="hdr-right">
    <button class="btn-glosario" onclick="openGlosario()">📚 Glosario</button>
    <div class="hdr-date" id="hdate"></div>
  </div>
</div>

<div class="sec">
  <h2>📋 Datos del Paciente</h2>
  <div class="pgrid">
    <div><label>Nombre completo</label><input type="text" id="pnombre" placeholder="Nombre del paciente" autocomplete="off" autocorrect="off" autocapitalize="words"></div>
    <div><label>RUT / ID</label><input type="text" id="prut" placeholder="12.345.678-9" autocomplete="off"></div>
    <div><label>Edad</label><input type="text" id="pedad" placeholder="Ej: 35" inputmode="numeric"></div>
    <div><label>Fecha</label><input type="date" id="pfecha"></div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="suplementos">💊 Suplementos</div>
    <div class="tab" data-tab="convencionales">💉 Convencionales</div>
    <div class="tab" data-tab="heel">🔵 Heel</div>
    <div class="tab" data-tab="magistral">⚗️ Magistral</div>
    <div class="tab" data-tab="alimentos">🥦 Alimentos</div>
    <div class="tab" data-tab="indicaciones">📝 Indicaciones</div>
  </div>
</div>
<div class="panels" id="panels">
  <div class="panel active" id="p-suplementos"></div>
  <div class="panel" id="p-convencionales"></div>
  <div class="panel" id="p-heel"></div>
  <div class="panel" id="p-magistral"></div>
  <div class="panel" id="p-alimentos"></div>
  <div class="panel" id="p-indicaciones"></div>
</div>

<div class="footer">
  <button class="btn btn-clear" onclick="clearAll()" title="Limpiar receta">🗑</button>
  <button class="btn btn-copy" id="copybtn" onclick="copyToClipboard()">📋 Copiar</button>
  <button class="btn btn-prev" onclick="openPrev()">👁 Ver</button>
  <button class="btn btn-print" onclick="doPrint()">🖨 Imprimir</button>
</div>

<!-- Vista previa -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hdr">
      <strong>Vista previa</strong>
      <button class="modal-close" onclick="closePrev()">✕</button>
    </div>
    <div id="mcontent"></div>
  </div>
</div>

<!-- Glosario -->
<div class="overlay" id="gmodal">
  <div class="modal">
    <div class="modal-hdr">
      <strong>📚 Editor de Glosario</strong>
      <button class="modal-close" onclick="closeGlosario()">✕</button>
    </div>
    <div class="gtabs" id="gtabs"></div>
    <div class="gsearch-row">
      <input type="text" id="gnew" placeholder="Nuevo ítem a agregar..." autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
      <button class="btn-gadd" onclick="gAddNew()">+ Agregar</button>
    </div>
    <div class="gsf-wrap" style="margin-bottom:8px">
      <input type="text" id="gfilter" placeholder="Filtrar lista..." oninput="renderGlist()">
    </div>
    <div class="gcount" id="gcount"></div>
    <div class="glist" id="glist"></div>
    <div class="gsaved" id="gsaved">✅ Guardado</div>
  </div>
</div>

<div id="parea"></div>

<script>

// ── Glosario con persistencia localStorage ──
const LS_KEY = 'amfelen_glosario_v1';
let G = {};

function loadGlosario(){
  try{
    const saved = localStorage.getItem(LS_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      // Merge: base + saved additions, remove deletions
      G = parsed;
    } else {
      // Primera vez: clonar base
      G = {};
      CATS.forEach(c => G[c] = [...BASE_G[c]]);
    }
  } catch(e){
    G = {};
    CATS.forEach(c => G[c] = [...BASE_G[c]]);
  }
}

function saveGlosario(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(G));
    const el = document.getElementById('gsaved');
    el.style.display='block';
    setTimeout(()=>el.style.display='none', 1800);
  } catch(e){ alert('No se pudo guardar. Almacenamiento lleno.'); }
}

function resetGlosario(){
  if(!confirm('¿Restablecer el glosario a los valores originales? Se perderán todos los cambios.')) return;
  CATS.forEach(c => G[c] = [...BASE_G[c]]);
  saveGlosario();
  renderGlist();
}

function setupSearch(cat){
  const inp=document.getElementById('si-'+cat);
  const dd=document.getElementById('dd-'+cat);
  let selIdx=-1;
  inp.addEventListener('focus',()=>{if(inp.value.trim().length>=1)showDd(cat,inp.value.trim())});
  inp.addEventListener('input',()=>{const q=inp.value.trim();if(q.length<1){dd.style.display='none';return}showDd(cat,q);});
  inp.addEventListener('keydown',e=>{
    const dis=dd.querySelectorAll('.di');
    if(e.key==='ArrowDown'){e.preventDefault();selIdx=Math.min(selIdx+1,dis.length-1);hilite(dis,selIdx)}
    else if(e.key==='ArrowUp'){e.preventDefault();selIdx=Math.max(selIdx-1,0);hilite(dis,selIdx)}
    else if(e.key==='Enter'){e.preventDefault();
      if(selIdx>=0&&dis[selIdx]){addItem(cat,dis[selIdx].dataset.val);inp.value='';dd.style.display='none';selIdx=-1}
      else if(inp.value.trim()){addItem(cat,inp.value.trim());inp.value='';dd.style.display='none'}}
    else if(e.key==='Escape'){dd.style.display='none'}
  });
  inp.addEventListener('blur',()=>setTimeout(()=>dd.style.display='none',200));
}

function showDd(cat,q){
  const dd=document.getElementById('dd-'+cat);
  const items=G[cat]||[];
  const ql=q.toLowerCase();
  const matches=items.filter(x=>x.toLowerCase().includes(ql)).slice(0,60);
  if(!matches.length){dd.innerHTML='<div class="de">Sin resultados. Usa ✏️ Libre.</div>'}
  else{
    const re2=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    dd.innerHTML=matches.map((m,i)=>`<div class="di" data-val="${esc(m)}">${m.replace(re2,'<mark>$1</mark>')}</div>`).join('');
    dd.querySelectorAll('.di').forEach(it=>{
      it.addEventListener('mousedown',e=>{e.preventDefault();addItem(cat,it.dataset.val);document.getElementById('si-'+cat).value='';dd.style.display='none'});
      it.addEventListener('touchend',e=>{e.preventDefault();addItem(cat,it.dataset.val);document.getElementById('si-'+cat).value='';dd.style.display='none'});
    });
  }
  dd.style.display='block';
}

function hilite(dis,idx){dis.forEach((d,i)=>d.style.background=i===idx?'var(--gp)':'');if(dis[idx])dis[idx].scrollIntoView({block:'nearest'})}
function addItem(cat,text){if(!text.trim())return;state[cat].push(text.trim());render(cat)}
function addFree(cat){const t=prompt('Ingrese el ítem:');if(t&&t.trim())addItem(cat,t.trim())}
function removeItem(cat,i){state[cat].splice(i,1);render(cat)}

function render(cat){
  const el=document.getElementById('lst-'+cat);
  const cnt=document.getElementById('cnt-'+cat);
  const items=state[cat];
  cnt.textContent=items.length+(items.length===1?' ítem':' ítems');
  if(!items.length){el.innerHTML='<div class="empty">Sin ítems. Busca arriba para agregar.</div>';return}
  el.innerHTML=items.map((item,i)=>`
    <div class="ir">
      <span class="inum">${i+1}</span>
      <span class="itext" contenteditable="true" onblur="state['${cat}'][${i}]=this.innerText.trim()">${esc(item)}</span>
      <button class="btn-del" onclick="removeItem('${cat}',${i})">✕</button>
    </div>`).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function total(){return Object.values(state).reduce((a,b)=>a+b.length,0)}

// ── GLOSARIO EDITOR ──
let gCat = 'suplementos';

function openGlosario(){
  // Build tabs
  const tabsEl = document.getElementById('gtabs');
  tabsEl.innerHTML = CATS.map(c=>`<div class="gtab${c===gCat?' active':''}" onclick="setGcat('${c}')">${LABELS[c].split(' ')[0]}</div>`).join('');
  document.getElementById('gnew').value='';
  document.getElementById('gfilter').value='';
  renderGlist();
  document.getElementById('gmodal').classList.add('open');
}

function closeGlosario(){
  document.getElementById('gmodal').classList.remove('open');
}

function setGcat(cat){
  gCat=cat;
  document.getElementById('gnew').value='';
  document.getElementById('gfilter').value='';
  document.querySelectorAll('.gtab').forEach(t=>{
    t.classList.toggle('active', t.textContent===LABELS[cat].split(' ')[0] || t.onclick.toString().includes(`'${cat}'`));
  });
  // Re-render tabs cleanly
  const tabsEl = document.getElementById('gtabs');
  tabsEl.innerHTML = CATS.map(c=>`<div class="gtab${c===gCat?' active':''}" onclick="setGcat('${c}')">${LABELS[c].split(' ')[0]}</div>`).join('');
  renderGlist();
}

function renderGlist(){
  const items = G[gCat] || [];
  const filter = (document.getElementById('gfilter').value||'').toLowerCase();
  const filtered = filter ? items.filter(x=>x.toLowerCase().includes(filter)) : items;
  
  document.getElementById('gcount').textContent = filter
    ? `Mostrando ${filtered.length} de ${items.length} ítems`
    : `${items.length} ítems en total`;

  const el = document.getElementById('glist');
  if(!filtered.length){
    el.innerHTML='<div class="gempty">Sin resultados.</div>';
    return;
  }
  el.innerHTML = filtered.map((item,fi)=>{
    const realIdx = items.indexOf(item); // real index in G[gCat]
    return `<div class="gitem">
      <span class="gitem-text" contenteditable="true" onblur="gEdit(${realIdx},this.innerText)">${esc(item)}</span>
      <button class="btn-gdel" onclick="gDelete(${realIdx})" title="Eliminar">✕</button>
    </div>`;
  }).join('');
}

function gAddNew(){
  const inp = document.getElementById('gnew');
  const text = inp.value.trim();
  if(!text){inp.focus();return;}
  if(!G[gCat]) G[gCat]=[];
  // Check duplicate
  if(G[gCat].some(x=>x.toLowerCase()===text.toLowerCase())){
    alert('Ese ítem ya existe en el glosario.');
    return;
  }
  G[gCat].push(text);
  G[gCat].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
  inp.value='';
  saveGlosario();
  renderGlist();
}

function gEdit(idx, newText){
  const text = newText.trim();
  if(!text){renderGlist();return;}
  if(text === G[gCat][idx]) return; // no change
  G[gCat][idx] = text;
  G[gCat].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
  saveGlosario();
  // small delay to avoid cursor issues, then re-render
  setTimeout(()=>renderGlist(), 100);
}

function gDelete(idx){
  const item = G[gCat][idx];
  if(!confirm(`¿Eliminar del glosario?\n"${item}"`)) return;
  G[gCat].splice(idx,1);
  saveGlosario();
  renderGlist();
}

// Enter to add in glosario input
document.getElementById('gnew').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();gAddNew();}
});

// ── Vista previa / Imprimir ──
function buildHTML(){
  const nombre=document.getElementById('pnombre').value||'—';
  const rut=document.getElementById('prut').value||'—';
  const edad=document.getElementById('pedad').value||'—';
  const fecha=document.getElementById('pfecha').value;
  const fstr=fecha?new Date(fecha+'T12:00:00').toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'}):'—';
  const cats=CATS.filter(c=>state[c].length>0);
  return `<div class="pp">
    <div class="ph2"><div><h1>🌿 Am Felen · Medicina de la Tierra</h1><div>Medicina Integrativa · Homeopatía · Nutrición</div></div><div><b>Fecha:</b> ${fstr}</div></div>
    <div class="ppt"><table><tr><td><b>Paciente:</b> ${esc(nombre)}</td><td><b>RUT:</b> ${esc(rut)}</td><td><b>Edad:</b> ${esc(edad)} años</td></tr></table></div>
    ${cats.map(cat=>`<div class="psec"><div class="pst">${LABELS[cat]}</div><ol>${state[cat].map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join('')}
    <div class="pftr"><span>Receta generada electrónicamente · Am Felen</span><span>${fstr}</span></div>
    <div class="psign">Firma y timbre médico</div>
  </div>`;
}

function openPrev(){
  if(!total()){alert('La receta está vacía.');return}
  document.getElementById('mcontent').innerHTML=buildHTML();
  document.getElementById('overlay').classList.add('open');
}
function closePrev(){document.getElementById('overlay').classList.remove('open')}
function doPrint(){
  if(!total()){alert('La receta está vacía.');return}
  document.getElementById('parea').innerHTML=buildHTML();
  window.print();
}

function buildPlainText(){
  const cats=CATS.filter(c=>state[c].length>0);
  if(!cats.length)return '';
  return cats.map(cat=>state[cat].join('\n')).join('\n');
}

function copyToClipboard(){
  if(!total()){alert('La receta está vacía.');return}
  const text=buildPlainText();
  const btn=document.getElementById('copybtn');
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✅ Copiado';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copiar';btn.classList.remove('copied')},2500);
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');btn.textContent='✅ Copiado';btn.classList.add('copied');setTimeout(()=>{btn.textContent='📋 Copiar';btn.classList.remove('copied')},2500)}
    catch(e){alert('No se pudo copiar. Usa Vista previa y copia manualmente.')}
    document.body.removeChild(ta);
  });
}

function clearAll(){
  if(!confirm('¿Limpiar toda la receta?'))return;
  CATS.forEach(c=>{state[c]=[];render(c)});
}

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closePrev()});
document.getElementById('gmodal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeGlosario()});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
